<script>
    const BOT_TOKEN = '8987413604:AAFJIrOKXxghzL6QwhpARyh4tgta494r85Q';
    const CHAT_ID = '-5286267356';
    // 🎯 방금 복사한 구글 웹 앱 주소를 여기에 붙여넣으세요!
    const GOOGLE_SHEET_URL = 'https://script.google.com/macros/s/AKfycbysWIP-W-4OvL-HrVi08QRKDVaTrsU9cwHWs_Ks-d3VOMpqnRZoKWx17QeCqZvG1nQ0Tw/exec';

    document.getElementById('rentForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const carModel = document.getElementById('car_model').value;
        const accidentType = document.getElementById('accident_type').value;
        
        const submitBtn = document.querySelector('.submit-btn');
        submitBtn.disabled = true;
        submitBtn.innerText = '접수 중...';

        // 1. 텔레그램 발송 데이터 및 요청
        const text = `🚨 [사고대차 DB 실시간 접수] 🚨\n\n` +
                     `👤 신청자: ${name}\n` +
                     `📞 연락처: ${phone}\n` +
                     `🚗 피해차종: ${carModel}\n` +
                     `📝 과실유형: ${accidentType}\n\n` +
                     `⚡ 확인 후 즉시 배차 연락 바랍니다.`;

        const telegramPromise = fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: CHAT_ID, text: text })
        });

        // 2. 구글 시트 발송 데이터 및 요청
        const sheetPromise = fetch(GOOGLE_SHEET_URL, {
            method: 'POST',
            body: JSON.stringify({
                name: name,
                phone: phone,
                carModel: carModel,
                accidentType: accidentType
            })
        });

        // 3. 둘 다 전송 완료되면 알림 띄우기
        Promise.all([telegramPromise, sheetPromise])
        .then(() => {
            alert('신청이 완료되었습니다. 담당자가 곧 연락드리겠습니다!');
            document.getElementById('rentForm').reset();
        })
        .catch(err => {
            console.error(err);
            alert('접수 중 시스템 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = '렌트카 즉시 신청하기';
        });
    });
</script>
