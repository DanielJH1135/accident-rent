<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💥 교통사고 피해차량 대차/렌트 즉시 문의</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; background-color: #f4f6f9; color: #333; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.1); position: relative; }
        img { width: 100%; display: block; height: auto; }
        
        /* 상담 신청 폼 디자인 */
        .form-section { padding: 40px 20px; background: #111; color: #fff; scroll-margin-top: 20px; }
        .form-section h2 { margin-top: 0; color: #ffcc00; font-size: 24px; letter-spacing: -1px; }
        .form-section p { color: #aaa; font-size: 14px; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; }
        .input-group input, .input-group select { width: 100%; padding: 14px; box-sizing: border-box; border: none; border-radius: 6px; font-size: 16px; background: #f9f9f9; }
        .input-group input:focus, .input-group select:focus { outline: 2px solid #ffcc00; background: #fff; }
        
        .submit-btn { width: 100%; padding: 16px; background: #ffcc00; border: none; border-radius: 6px; font-size: 18px; font-weight: bold; color: #111; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .submit-btn:hover { background: #fff; }

        /* 🎯 우측 하단 따라다니는 플로팅 버튼 */
        .floating-btn {
            position: fixed;
            bottom: 30px;
            right: 20px;
            background: #ffcc00;
            color: #111;
            padding: 15px 20px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-decoration: none;
            z-index: 9999;
            transition: 0.3s ease;
            animation: bounce 2s infinite;
        }
        .floating-btn:hover { background: #fff; transform: scale(1.05); }

        /* 버튼 통통 튀는 애니메이션 효과 (주목도 UP) */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>

    <a href="#rentFormSection" class="floating-btn">💥 초고속 대차 신청</a>

    <div class="container">
        <img src="1.jpg" alt="사고대차 안내 1">
        <img src="2.jpg" alt="사고대차 안내 2">
        <img src="3.jpg" alt="사고대차 안내 3">
        <img src="4.jpg" alt="사고대차 안내 4">
        <img src="5.jpg" alt="사고대차 안내 5">
        <img src="6.jpg" alt="사고대차 안내 6">
        <img src="7.jpg" alt="사고대차 안내 7">
        <img src="8.jpg" alt="사고대차 안내 8">

        <div class="form-section" id="rentFormSection">
            <h2>🚨 실시간 최고등급 대차 신청</h2>
            <p>정보를 입력하시면 담당자가 즉시 연락드립니다.</p>
            
            <form id="rentForm">
                <div class="input-group">
                    <input type="text" id="name" placeholder="고객 성함" required>
                </div>
                <div class="input-group">
                    <input type="tel" id="phone" placeholder="연락처 (예: 010-1234-5678)" required>
                </div>
                <div class="input-group">
                    <input type="text" id="car_model" placeholder="피해 차량 종류 및 배기량 (ex: 그랜저 2.4)" required>
                </div>
                <div class="input-group">
                    <select id="accident_type">
                        <option value="과실 없음 (100:0)">과실 없음 (100:0)</option>
                        <option value="과실 있음 (쌍방과실 8:2 이상)">과실 있음 (8:2 이상)</option>
                        <option value="과실 있음 (쌍방과실 8:2 이하)">과실 있음 (8:2 이하)</option>
                        <option value="단독사고 / 자차 / 기타">단독사고 / 자차 / 기타 문의</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn">렌트카 즉시 신청하기</button>
            </form>
        </div>
    </div>

    <script>
        // 플로팅 버튼 부드러운 스크롤 이동 기능
        document.querySelector('.floating-btn').addEventListener('click', function(e) {
            e.preventDefault();
            document.querySelector('#rentFormSection').scrollIntoView({ behavior: 'smooth' });
        });

        document.getElementById('rentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const carModel = document.getElementById('car_model').value;
            const accidentType = document.getElementById('accident_type').value;
            
            const submitBtn = document.querySelector('.submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerText = '접수 중...';

            // 1. 보안을 위해 외부 주소 다 빼고 내 Vercel 서버리스 주소로 쏠 데이터 팩킹
            const payload = {
                name: name,
                phone: phone,
                carModel: carModel,
                accidentType: accidentType
            };

            // 2. Vercel 서버리스 함수 라우트로 깔끔하게 단 한 번만 전송
            fetch('/api/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(res => {
                if (!res.ok) {
                    throw new Error('서버리스 함수 응답 오류');
                }
                return res.json();
            })
            .then(data => {
                alert('신청이 완료되었습니다. 담당자가 곧 연락드리겠습니다!');
                document.getElementById('rentForm').reset();
            })
            .catch(err => {
                console.error(err);
                alert('접수 중 오류가 발생했습니다. Vercel 실시간 로그를 확인해주세요.');
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = '렌트카 즉시 신청하기';
            });
        });
    </script>
</body>
</html>
